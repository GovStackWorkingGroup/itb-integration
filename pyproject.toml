[project]
name = "itb-integration"
version = "0.1.0"
description = "Scripts to integrate govstack information to the ITB"
readme = "README.md"
authors = [
    { name = "Abraham Toriz", email = "categulario@mail.mayfirst.org" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
itbload = "itb_integration.cli:cli"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
