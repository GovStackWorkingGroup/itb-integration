name: 'Publish to ITB'
description: |
  Add me to a building block repository to publish its functionalities as test
  suites in an ITB instance.
inputs:
  src-path:
    required: true
    description: the path within the source to the directory containing metadata.yaml
  itb-url:
    required: true
    description: URL of the itb instance
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      shell: bash
      run: pip install pyyaml requests
    - name: Convert to ITB format
      shell: bash
      env:
        INPUT_SRC: ${{ inputs.src-path }}
      run: python "${{ github.action_path }}/src/itb_integration/convert.py" "$INPUT_SRC" -o build
    - name: Upload to ITB instance
      shell: bash
      run: python "${{ github.action_path }}/src/itb_integration/upload.py" -u "$INPUT_ITB_URL" build
