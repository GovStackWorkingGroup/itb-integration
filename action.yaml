name: 'Publish to ITB'
description: |
  Add me to a building block repository to publish its functionalities as test
  suites in an ITB instance.
inputs:
  src-path:
    required: true
    description: the path within the source to the directory containing metadata.yaml
  itb-url:
    required: true
    description: URL of the itb instance
  itb-org-key:
    required: true
    description: Key to the organization managing the domain
  itb-group-key:
    required: true
    description: Key to the spec group
  itb-domain-key:
    required: true
    description: Key to the domain containing this spec
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      shell: bash
      run: pip install pyyaml requests
    - name: Convert to ITB format
      shell: bash
      env:
        INPUT_SRC: ${{ inputs.src-path }}
      run: python "${{ github.action_path }}/src/itb_integration/convert.py" "$INPUT_SRC" -o build
    - name: Upload to ITB instance
      shell: bash
      run: python "${{ github.action_path }}/src/itb_integration/upload.py" -u "$ITB_URL" build
      env:
        ITB_URL: ${{ inputs.itb-url }}
        ITB_ORG_KEY: ${{ inputs.itb-org-key }}
        ITB_GROUP_KEY: ${{ inputs.itb-group-key }}
        ITB_DOMAIN_KEY: ${{ inputs.itb-domain-key }}
